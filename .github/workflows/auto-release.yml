name: Tag And Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      components:
        description: "Component to release ('all', 'android', or 'gateway')"
        required: false
        type: choice
        options:
          - all
          - android
          - gateway
        default: all
      force_all:
        description: "Force release tag even without detected code changes"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  tag:
    name: Compute and create release tags
    runs-on: ubuntu-latest
    outputs:
      has_android: ${{ steps.tag.outputs.has_android }}
      android_version: ${{ steps.tag.outputs.android_version }}
      android_tag: ${{ steps.tag.outputs.android_tag }}
      android_version_code: ${{ steps.tag.outputs.android_version_code }}
      has_gateway: ${{ steps.tag.outputs.has_gateway }}
      gateway_version: ${{ steps.tag.outputs.gateway_version }}
      gateway_tag: ${{ steps.tag.outputs.gateway_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute and push tags
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          EVENT_NAME="${{ github.event_name }}"
          REQUESTED_COMPONENTS="${{ github.event.inputs.components || 'all' }}"
          FORCE_ALL="${{ github.event.inputs.force_all || false }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch requested."
            echo "  Components filter: $REQUESTED_COMPONENTS"
            echo "  Force all: $FORCE_ALL"
          fi

          if [ "$REQUESTED_COMPONENTS" = "android" ]; then
            COMPONENTS="android"
          elif [ "$REQUESTED_COMPONENTS" = "gateway" ]; then
            COMPONENTS="gateway"
          else
            COMPONENTS="android gateway"
          fi

          HAS_ANDROID="false"
          ANDROID_VERSION=""
          ANDROID_TAG=""
          ANDROID_VERSION_CODE="100"

          HAS_GATEWAY="false"
          GATEWAY_VERSION=""
          GATEWAY_TAG=""

          for COMPONENT in $COMPONENTS; do
            echo "──────────────────────────────────────────────"
            echo "Component: $COMPONENT"

            # 1. Find most recent tag for this component
            LAST_TAG=$(git tag --list "${COMPONENT}-v*" | sort -V | tail -n 1 || true)

            if [ -z "$LAST_TAG" ]; then
              echo "  No existing tag found for ${COMPONENT}. Baseline for initial release."
              BASE_REF=$(git rev-list --max-parents=0 HEAD)
              IS_INITIAL="true"
              LAST_VERSION="0.1.0"
            else
              echo "  Last tag: $LAST_TAG"
              BASE_REF="$LAST_TAG"
              IS_INITIAL="false"
              LAST_VERSION="${LAST_TAG#${COMPONENT}-v}"
            fi

            # 2. Check if any paths for this component changed since last tag
            if [ "$COMPONENT" = "gateway" ]; then
              CHANGED=$(git diff --name-only "$BASE_REF" HEAD -- "gateway/" "pi/" || true)
              COMMITS=$(git log "${BASE_REF}..HEAD" --pretty=format:"%s" -- "gateway/" "pi/" || true)
            else
              CHANGED=$(git diff --name-only "$BASE_REF" HEAD -- "${COMPONENT}/" || true)
              COMMITS=$(git log "${BASE_REF}..HEAD" --pretty=format:"%s" -- "${COMPONENT}/" || true)
            fi

            if [ "$FORCE_ALL" != "true" ] && [ -z "$CHANGED" ]; then
              echo "  No relevant changes under ${COMPONENT}/ — skipping."
              continue
            fi

            if [ "$FORCE_ALL" = "true" ] && [ -z "$CHANGED" ]; then
              echo "  No file changes detected, but force_all=true: proceeding with release."
            fi

            echo "  Detected changes under ${COMPONENT}/:"
            echo "$CHANGED" | sed 's/^/    /'

            if [ "$IS_INITIAL" = "true" ]; then
              BUMP="initial"
              NEXT_VERSION="0.1.0"
            else
              BUMP="patch"
              while IFS= read -r MSG; do
                [ -z "$MSG" ] && continue
                if echo "$MSG" | grep -qiE '(BREAKING[[:space:]]CHANGE|!:)'; then
                  BUMP="major"
                  break
                fi
                if [ "$BUMP" != "major" ] && echo "$MSG" | grep -qiE '^feat(\(.+\))?!?:'; then
                  BUMP="minor"
                fi
              done <<< "$COMMITS"

              IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi

            echo "  Bump type: $BUMP"
            NEW_TAG="${COMPONENT}-v${NEXT_VERSION}"

            # 4. Guard: skip if tag already exists
            if git tag --list "$NEW_TAG" | grep -qx "$NEW_TAG"; then
              echo "  Tag $NEW_TAG already exists — skipping push."
              continue
            fi

            echo "  Creating tag: $NEW_TAG"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"

            if [ "$COMPONENT" = "android" ]; then
              HAS_ANDROID="true"
              ANDROID_VERSION="$NEXT_VERSION"
              ANDROID_TAG="$NEW_TAG"
              IFS='.' read -r V_MAJ V_MIN V_PAT <<< "$NEXT_VERSION"
              ANDROID_VERSION_CODE=$((V_MAJ * 10000 + V_MIN * 100 + V_PAT))
            elif [ "$COMPONENT" = "gateway" ]; then
              HAS_GATEWAY="true"
              GATEWAY_VERSION="$NEXT_VERSION"
              GATEWAY_TAG="$NEW_TAG"
            fi
          done

          echo "──────────────────────────────────────────────"
          echo "has_android=$HAS_ANDROID" >> "$GITHUB_OUTPUT"
          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_tag=$ANDROID_TAG" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "has_gateway=$HAS_GATEWAY" >> "$GITHUB_OUTPUT"
          echo "gateway_version=$GATEWAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "gateway_tag=$GATEWAY_TAG" >> "$GITHUB_OUTPUT"

  release-android:
    name: Build & Release Android App (${{ needs.tag.outputs.android_tag }})
    needs: tag
    if: needs.tag.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.tag.outputs.android_tag }}

      - name: Ensure git tags are available
        run: git fetch --tags --force

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Go 1.24
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Set up Android NDK
        run: |
          echo "Installing Android NDK 27.2.12479018..."
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build libwgrelay.so (arm64-v8a, 16 KB page-aligned)
        run: |
          chmod +x android/build_wgrelay.sh
          bash android/build_wgrelay.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=${{ needs.tag.outputs.android_version }} \
            -PversionCode=${{ needs.tag.outputs.android_version_code }}

      - name: Align and Sign APK
        run: |
          set -euo pipefail

          VERSION="${{ needs.tag.outputs.android_version }}"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          FINAL_APK="cellular-wan-failover-v${VERSION}.apk"

          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"

          echo "Using Android Build Tools: ${BUILD_TOOLS_DIR}"

          # 1. 16 KB page-align APK
          "$ZIPALIGN" -f -p 16 "$UNSIGNED_APK" aligned.apk

          # 2. Sign APK
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "Signing APK using production keystore secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KEY_PASS="${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "$FINAL_APK" \
              aligned.apk
            rm -f release.keystore
          else
            echo "::warning::Production signing secrets not found. Generating temporary installable release key..."
            keytool -genkeypair -v \
              -keystore fallback.keystore \
              -alias androidrelease \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Cellular WAN Failover, OU=Release, O=OpenSource, C=US"
            "$APKSIGNER" sign \
              --ks fallback.keystore \
              --ks-pass pass:android \
              --ks-key-alias androidrelease \
              --key-pass pass:android \
              --out "$FINAL_APK" \
              aligned.apk
            rm -f fallback.keystore
          fi

          # 3. Verify signature
          "$APKSIGNER" verify --verbose "$FINAL_APK"

          # 4. Generate SHA-256 checksum
          sha256sum "$FINAL_APK" > checksums.sha256
          echo "Artifacts generated:"
          ls -la "$FINAL_APK" checksums.sha256

      - name: Generate Release Notes
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ needs.tag.outputs.android_tag }}"
          VERSION="${{ needs.tag.outputs.android_version }}"

          PREV_TAG=$(git tag --list "android-v*" | sort -V | grep -v "^${CURRENT_TAG}$" | tail -n 1 || true)

          {
            if [ -z "$PREV_TAG" ]; then
              echo "## What's New"
              echo "- Initial release of Cellular WAN Failover Android application (v${VERSION})"
            else
              echo "Generating changelog between ${PREV_TAG} and ${CURRENT_TAG}" >&2
              COMMITS=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"%s" -- "android/" | head -100)

              FEATURES=$(echo "$COMMITS" | grep -iE '^feat(\(.+\))?!?:' | sed 's/^/- /' || true)
              FIXES=$(echo "$COMMITS"    | grep -iE '^fix(\(.+\))?!?:'  | sed 's/^/- /' || true)
              OTHERS=$(echo "$COMMITS"   | grep -ivE '^(feat|fix)(\(.+\))?!?:' | sed 's/^/- /' || true)

              if [ -z "$FEATURES$FIXES$OTHERS" ]; then
                echo "No code changes recorded — see full commit history."
              else
                [ -n "$FEATURES" ] && printf "## What's New\n%s\n\n" "$FEATURES"
                [ -n "$FIXES"    ] && printf "## Bug Fixes\n%s\n\n"  "$FIXES"
                [ -n "$OTHERS"   ] && printf "## Other Changes\n%s\n" "$OTHERS"
              fi
            fi
          } > release_notes.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.android_tag }}"
          VERSION="${{ needs.tag.outputs.android_version }}"
          FINAL_APK="cellular-wan-failover-v${VERSION}.apk"

          gh release create "$TAG" \
            --title "Android App v${VERSION}" \
            --notes-file release_notes.txt \
            "$FINAL_APK" checksums.sha256

  release-gateway:
    name: Build & Release Gateway (${{ needs.tag.outputs.gateway_tag }})
    needs: tag
    if: needs.tag.outputs.has_gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.tag.outputs.gateway_tag }}

      - name: Ensure git tags are available
        run: git fetch --tags --force

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cellular-wan-gateway
          tags: |
            type=raw,value=${{ needs.tag.outputs.gateway_version }}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./gateway
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Release Notes
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ needs.tag.outputs.gateway_tag }}"
          VERSION="${{ needs.tag.outputs.gateway_version }}"
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cellular-wan-gateway"

          PREV_TAG=$(git tag --list "gateway-v*" | sort -V | grep -v "^${CURRENT_TAG}$" | tail -n 1 || true)

          {
            if [ -z "$PREV_TAG" ]; then
              echo "## What's New"
              echo "- Initial release of Cellular WAN Failover Gateway (v${VERSION})"
            else
              echo "Generating changelog between ${PREV_TAG} and ${CURRENT_TAG}" >&2
              COMMITS=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"%s" -- "gateway/" "pi/" | head -100)

              FEATURES=$(echo "$COMMITS" | grep -iE '^feat(\(.+\))?!?:' | sed 's/^/- /' || true)
              FIXES=$(echo "$COMMITS"    | grep -iE '^fix(\(.+\))?!?:'  | sed 's/^/- /' || true)
              OTHERS=$(echo "$COMMITS"   | grep -ivE '^(feat|fix)(\(.+\))?!?:' | sed 's/^/- /' || true)

              if [ -z "$FEATURES$FIXES$OTHERS" ]; then
                echo "No code changes recorded — see full commit history."
              else
                [ -n "$FEATURES" ] && printf "## What's New\n%s\n\n" "$FEATURES"
                [ -n "$FIXES"    ] && printf "## Bug Fixes\n%s\n\n"  "$FIXES"
                [ -n "$OTHERS"   ] && printf "## Other Changes\n%s\n" "$OTHERS"
              fi
            fi

            echo ""
            echo "### Deployment"
            echo "Pull and run the multi-arch container image directly:"
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE_NAME}:${VERSION}"
            echo "docker pull ${IMAGE_NAME}:latest"
            echo "\`\`\`"
          } > release_notes.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.gateway_tag }}"
          VERSION="${{ needs.tag.outputs.gateway_version }}"

          gh release create "$TAG" \
            --title "Gateway Service v${VERSION}" \
            --notes-file release_notes.txt
