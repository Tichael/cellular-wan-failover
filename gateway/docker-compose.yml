services:
  wan-failover-gateway:
    build: .
    image: ${GATEWAY_IMAGE:-ghcr.io/tichael/cellular-wan-gateway:latest}
    container_name: ${CONTAINER_NAME:-wan-failover-gateway}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - path: .env
        required: false
    volumes:
      - /lib/modules:/lib/modules:ro